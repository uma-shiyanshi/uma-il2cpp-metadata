name: blackbox-build

# BlackBox（Android 16 + 中文）+ Hachimi 作为宿主 APK 的 libmain.so
# 实验 1：不预先 System.load，而是把 Hachimi 打进宿主 APK 的 lib/arm64-v8a/libmain.so，
#          让 guest 进程自己的 System.loadLibrary("main") 从真实 lib 路径加载它（最贴近其设计）
on:
  push:
    paths:
      - '.github/workflows/blackbox-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉源码 + 装 NDK
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; : > "$LOG"
          UP="$GITHUB_WORKSPACE/upstream"
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$UP" >> "$LOG" 2>&1
          echo "commit: $(git -C "$UP" rev-parse --short HEAD)" >> "$LOG"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >> "$LOG" 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "platforms;android-36" >> "$LOG" 2>&1 || echo "sdkmanager 部分失败（继续）" >> "$LOG"

      - name: 取 Hachimi so 放进 jniLibs
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          mkdir -p /tmp/hz && cd /tmp/hz
          gh release download 'v0.14.0。' -R "$GITHUB_REPOSITORY" -p 'zygisk-hachimi2020-*.zip' --clobber >> "$LOG" 2>&1 || echo "下载失败" >> "$LOG"
          ls -l /tmp/hz >> "$LOG" 2>&1
          unzip -o /tmp/hz/zygisk-hachimi2020-*.zip 'lib/arm64-v8a/libhachimi.so' -d /tmp/hz >> "$LOG" 2>&1 || echo "解压失败" >> "$LOG"
          mkdir -p "$GITHUB_WORKSPACE/upstream/app/src/main/jniLibs/arm64-v8a"
          cp /tmp/hz/lib/arm64-v8a/libhachimi.so "$GITHUB_WORKSPACE/upstream/app/src/main/jniLibs/arm64-v8a/libmain.so" >> "$LOG" 2>&1 || echo "拷贝失败" >> "$LOG"
          ls -l "$GITHUB_WORKSPACE/upstream/app/src/main/jniLibs/arm64-v8a" >> "$LOG" 2>&1

      - name: 打补丁
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          python3 - "$GITHUB_WORKSPACE/upstream" >> "$LOG" 2>&1 <<'PY'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])

          mf = root / "app/src/main/AndroidManifest.xml"
          m = mf.read_text(encoding="utf-8")
          if "MANAGE_EXTERNAL_STORAGE" not in m:
              a = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"'
              if a in m:
                  mf.write_text(m.replace(a, '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    ' + a, 1), encoding="utf-8")
                  print("OK manifest")

          wv = root / "Bcore/src/main/java/top/niunaijun/blackbox/fake/service/WebViewProxy.java"
          s = wv.read_text(encoding="utf-8")
          anchor = ("                if (args != null && args.length > 0 && args[0] instanceof Context) {\n"
                    "                    context = (Context) args[0];")
          if anchor in s:
              s = s.replace(anchor, anchor + ("\n                    Context __host = BlackBoxCore.getContext();\n"
                                              "                    if (__host != null) { args[0] = __host; context = __host; }"), 1)
              wv.write_text(s, encoding="utf-8")
              print("OK WebViewProxy")

          bt = root / "Bcore/src/main/java/top/niunaijun/blackbox/app/BActivityThread.java"
          b = bt.read_text(encoding="utf-8")
          anchor2 = ("        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {\n"
                     "            WebView.setDataDirectorySuffix(")
          logline = ("        android.util.Log.i(\"BB_INJECT\", \"guest processName=\" + processName"
                     " + \" nativeLibDir=\" + (applicationInfo != null ? applicationInfo.nativeLibraryDir : \"null\"));\n")
          if anchor2 in b and "BB_INJECT" not in b:
              bt.write_text(b.replace(anchor2, logline + anchor2, 1), encoding="utf-8")
              print("OK BActivityThread 只加日志")

          ZH = {"installed_app": "已安装应用", "empty_empty": "空空如也", "filter": "过滤",
                "setting": "设置", "done": "完成", "cancel": "取消",
                "install_success": "安装成功", "install_fail": "安装失败：%s",
                "uninstall_success": "卸载成功", "other": "其他"}
          sx = root / "app/src/main/res/values/strings.xml"
          tx = sx.read_text(encoding="utf-8")
          n = 0
          for k, v in ZH.items():
              tx2, cnt = re.subn(r'<string name="%s">.*?</string>' % re.escape(k),
                                 '<string name="%s">%s</string>' % (k, v), tx, count=1, flags=re.S)
              if cnt:
                  tx = tx2; n += 1
          sx.write_text(tx, encoding="utf-8")
          print("OK strings %d" % n)
          PY

      - name: 编译
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE/upstream"
          chmod +x gradlew
          ( ./gradlew :app:assembleDebug --no-daemon --stacktrace ) >> "$LOG" 2>&1
          echo "gradle exit=$?" >> "$LOG"

      - name: 发布
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE"
          APK=$(find upstream -name "*debug*.apk" | head -1)
          echo "APK=${APK:-none}" >> "$LOG"
          if [ -n "$APK" ]; then
            echo "输出: $(stat -c%s "$APK") B" >> "$LOG"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)" >> "$LOG"
            unzip -l "$APK" | grep -E "libmain" >> "$LOG" 2>&1
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$APK" "bb-hostlibmain-$(date -u +%m%d-%H%M).apk"
            gh release upload builds bb-hostlibmain-*.apk -R "$GITHUB_REPOSITORY" --clobber >> "$LOG" 2>&1
            echo "发布: 完成" >> "$LOG"
          fi
          { echo "run: $GITHUB_RUN_ID  $(date -u +%FT%TZ)"; echo "--- 末尾 100 行 ---"; tail -n 100 "$LOG"; } > blackbox-build-status.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blackbox-build-status.txt || true
          git commit -m "ci: blackbox build ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true