name: blackbox-build

# 晚加载 v5：用绝对路径 System.load 触发 Hachimi 的 dlopen 回调（loadLibrary 找不到 nativelib）
on:
  push:
    paths:
      - '.github/workflows/blackbox-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 固定签名
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; : > "$LOG"; mkdir -p ci
          if [ ! -f ci/bb.jks ]; then
            keytool -genkeypair -v -keystore ci/bb.jks -alias bb -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass bbpass12 -keypass bbpass12 \
              -dname "CN=BlackBoxCI,OU=DSH,O=Uma,L=NA,S=NA,C=CN" >> "$LOG" 2>&1
            git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f ci/bb.jks && git commit -m "ci: keystore" >> "$LOG" 2>&1 || true
            git push >> "$LOG" 2>&1 || true
          fi
      - name: 拉源码 + 装 NDK
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; UP="$GITHUB_WORKSPACE/upstream"
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$UP" >> "$LOG" 2>&1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >> "$LOG" 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "platforms;android-36" >> "$LOG" 2>&1 || true
      - name: 打补丁
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          python3 - "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE" >> "$LOG" 2>&1 <<'PY'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1]); ws = pathlib.Path(sys.argv[2])

          gb = root / "app/build.gradle"; g = gb.read_text(encoding="utf-8")
          if "bbci_keystore" not in g:
              sig = ("    signingConfigs {\n        bbci_keystore {\n"
                     "            storeFile file(\"%s\")\n"
                     "            storePassword 'bbpass12'\n            keyAlias 'bb'\n"
                     "            keyPassword 'bbpass12'\n        }\n    }\n" % (ws / "ci" / "bb.jks"))
              g = g.replace("    defaultConfig {", sig + "    defaultConfig {", 1)
              g = re.sub(r"(buildTypes\s*\{)", r"\1\n        debug { signingConfig signingConfigs.bbci_keystore }", g, count=1)
              gb.write_text(g, encoding="utf-8"); print("OK sign")

          mf = root / "app/src/main/AndroidManifest.xml"; m = mf.read_text(encoding="utf-8")
          if "MANAGE_EXTERNAL_STORAGE" not in m:
              a = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"'
              if a in m:
                  mf.write_text(m.replace(a, '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    ' + a, 1), encoding="utf-8")
                  print("OK manifest")

          wv = root / "Bcore/src/main/java/top/niunaijun/blackbox/fake/service/WebViewProxy.java"
          s = wv.read_text(encoding="utf-8")
          anchor = ("                if (args != null && args.length > 0 && args[0] instanceof Context) {\n"
                    "                    context = (Context) args[0];")
          if anchor in s:
              s = s.replace(anchor, anchor + ("\n                    Context __host = BlackBoxCore.getContext();\n"
                                              "                    if (__host != null) { args[0] = __host; context = __host; }"), 1)
              wv.write_text(s, encoding="utf-8"); print("OK webview")

          bt = root / "Bcore/src/main/java/top/niunaijun/blackbox/app/BActivityThread.java"
          b = bt.read_text(encoding="utf-8")
          anchor3 = "        Context packageContext = createPackageContext(applicationInfo);"
          redirect = (
            "        if (processName != null && processName.contains(\"umamusu\")) {\n"
            "            try {\n"
            "                android.content.Context __ctx = top.niunaijun.blackbox.BlackBoxCore.getContext();\n"
            "                java.io.File __srcDir = new java.io.File(applicationInfo.nativeLibraryDir);\n"
            "                java.io.File __realMain = new java.io.File(__srcDir, \"libmain.so\");\n"
            "                java.io.File __nl = new java.io.File(__ctx.getFilesDir(), \"nativelib\");\n"
            "                if (!__nl.exists()) { __nl.mkdirs(); }\n"
            "                java.io.File __h = new java.io.File(__nl, \"libhachimi.so\");\n"
            "                java.io.File __hsrc = new java.io.File(\"/sdcard/Download/libhachimi.so\");\n"
            "                if (__hsrc.exists() && (!__h.exists() || __h.length() != __hsrc.length())) {\n"
            "                    java.io.InputStream __in = new java.io.FileInputStream(__hsrc);\n"
            "                    java.io.OutputStream __out = new java.io.FileOutputStream(__h);\n"
            "                    byte[] __buf = new byte[262144]; int __n;\n"
            "                    while ((__n = __in.read(__buf)) > 0) { __out.write(__buf, 0, __n); }\n"
            "                    __in.close(); __out.close();\n"
            "                }\n"
            "                java.io.File[] __fs = __srcDir.listFiles();\n"
            "                if (__fs != null) for (java.io.File __f : __fs) {\n"
            "                    if (!__f.getName().endsWith(\".so\")) continue;\n"
            "                    if (__f.getName().equals(\"libmain.so\")) continue;\n"
            "                    java.io.File __t = new java.io.File(__nl, __f.getName());\n"
            "                    if (__f.getName().equals(\"libc++_shared.so\")) {\n"
            "                        if (!__t.exists() || __t.length() != __f.length()) {\n"
            "                            java.io.InputStream __i2 = new java.io.FileInputStream(__f);\n"
            "                            java.io.OutputStream __o2 = new java.io.FileOutputStream(__t);\n"
            "                            byte[] __b2 = new byte[131072]; int __n2;\n"
            "                            while ((__n2 = __i2.read(__b2)) > 0) { __o2.write(__b2, 0, __n2); }\n"
            "                            __i2.close(); __o2.close();\n"
            "                        }\n"
            "                        continue;\n"
            "                    }\n"
            "                    if (__t.exists()) continue;\n"
            "                    try { android.system.Os.symlink(__f.getAbsolutePath(), __t.getAbsolutePath()); } catch (Throwable __e) {}\n"
            "                }\n"
            "                java.io.File __lm = new java.io.File(__nl, \"libmain.so\");\n"
            "                if (__lm.exists()) __lm.delete();\n"
            "                android.system.Os.symlink(__realMain.getAbsolutePath(), __lm.getAbsolutePath());\n"
            "                java.io.File __ol = new java.io.File(__nl, \"libmain_orig.so\");\n"
            "                if (__ol.exists()) __ol.delete();\n"
            "                android.system.Os.symlink(__realMain.getAbsolutePath(), __ol.getAbsolutePath());\n"
            "                java.io.File __stale = new java.io.File(__ctx.getFilesDir(), \"libmain.so\");\n"
            "                if (__stale.exists()) __stale.delete();\n"
            "                applicationInfo.nativeLibraryDir = __nl.getAbsolutePath();\n"
            "                android.util.Log.i(\"BB_INJECT\", \"nativelib ready hachimi=\" + __h.length());\n"
            "                try {\n"
            "                    java.io.File __cfgSrc = new java.io.File(\"/sdcard/Download/hachimi_config.json\");\n"
            "                    java.io.File __cfgDir = new java.io.File(\"/sdcard/Android/media/com.bilibili.umamusu/hachimi\");\n"
            "                    if (!__cfgDir.exists()) __cfgDir.mkdirs();\n"
            "                    java.io.File __cfgDst = new java.io.File(__cfgDir, \"config.json\");\n"
            "                    if (__cfgSrc.canRead()) {\n"
            "                        java.io.InputStream __ci = new java.io.FileInputStream(__cfgSrc);\n"
            "                        java.io.OutputStream __co = new java.io.FileOutputStream(__cfgDst);\n"
            "                        byte[] __cb = new byte[8192]; int __cn;\n"
            "                        while ((__cn = __ci.read(__cb)) > 0) { __co.write(__cb, 0, __cn); }\n"
            "                        __ci.close(); __co.close();\n"
            "                        android.util.Log.i(\"BB_INJECT\", \"cfg written len=\" + __cfgDst.length());\n"
            "                    }\n"
            "                } catch (Throwable __ce) { android.util.Log.e(\"BB_INJECT\", \"cfg failed\", __ce); }\n"
            "                final java.io.File __hFinal = __h;\n"
            "                final java.io.File __nlFinal = __nl;\n"
            "                new Thread(new Runnable() { public void run() {\n"
            "                    try {\n"
            "                        Thread.sleep(18000);\n"
            "                        android.util.Log.i(\"BB_INJECT\", \"late loading\");\n"
            "                        System.load(__hFinal.getAbsolutePath());\n"
            "                        android.util.Log.i(\"BB_INJECT\", \"hachimi loaded (late)\");\n"
            "                        Thread.sleep(1000);\n"
            "                        java.io.File __il = new java.io.File(__nlFinal, \"libil2cpp.so\");\n"
            "                        try { System.load(__il.getAbsolutePath()); android.util.Log.i(\"BB_INJECT\", \"il2cpp trigger ok \" + __il.exists()); }\n"
            "                        catch (Throwable __e) { android.util.Log.e(\"BB_INJECT\", \"il2cpp trigger failed\", __e); }\n"
            "                        Thread.sleep(800);\n"
            "                        java.io.File __cri = new java.io.File(__nlFinal, \"libcri_ware_unity.so\");\n"
            "                        try { System.load(__cri.getAbsolutePath()); android.util.Log.i(\"BB_INJECT\", \"cri trigger ok \" + __cri.exists()); }\n"
            "                        catch (Throwable __e) { android.util.Log.e(\"BB_INJECT\", \"cri trigger failed\", __e); }\n"
            "                    } catch (Throwable __t) { android.util.Log.e(\"BB_INJECT\", \"late load failed\", __t); }\n"
            "                } }).start();\n"
            "            } catch (Throwable t) { android.util.Log.e(\"BB_INJECT\", \"prep failed\", t); }\n"
            "        }\n")
          if anchor3 in b and "BB_INJECT" not in b:
              bt.write_text(b.replace(anchor3, redirect + anchor3, 1), encoding="utf-8"); print("OK late-load v5")

          # 不再注入任何自动启动逻辑
          PY
      - name: 编译
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE/upstream"
          chmod +x gradlew
          ( ./gradlew :app:assembleDebug --no-daemon --stacktrace ) >> "$LOG" 2>&1
          echo "gradle exit=$?" >> "$LOG"
      - name: 发布
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; cd "$GITHUB_WORKSPACE"
          APK=$(find upstream/app/build/outputs/apk -name "*universal*debug*.apk" | head -1)
          [ -z "$APK" ] && APK=$(find upstream/app/build/outputs/apk -name "*debug*.apk" | head -1)
          if [ -n "$APK" ]; then
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$APK" "bb-trigger-$(date -u +%m%d-%H%M).apk"
            gh release upload builds bb-trigger-*.apk -R "$GITHUB_REPOSITORY" --clobber >> "$LOG" 2>&1
          fi
          { echo "run: $GITHUB_RUN_ID $(date -u +%FT%TZ)"; tail -n 40 "$LOG"; } > blackbox-build-status.txt
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blackbox-build-status.txt || true
          git commit -m "ci: blackbox ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true