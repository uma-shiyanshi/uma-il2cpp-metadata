name: commit-so

# 先触发 hachimi-build，等它跑完，再把产物取回来提交进仓库
on:
  push:
    paths:
      - '.github/workflows/commit-so.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: dispatch hachimi-build
        run: |
          gh workflow run hachimi-build.yml -R "$GITHUB_REPOSITORY" || true
          sleep 20
          RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hachimi-build.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          echo "run=$RID" >> $GITHUB_ENV
          echo "触发 run=$RID"
      - name: wait
        run: |
          for i in $(seq 1 60); do
            S=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ env.run }}" --jq '.status')
            C=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ env.run }}" --jq '.conclusion')
            echo "status=$S conclusion=$C"
            if [ "$S" = "completed" ]; then break; fi
            sleep 20
          done
      - name: download + commit
        run: |
          RID="${{ env.run }}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"' || true
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[0].id')
          echo "artifact=$AID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/a.zip
          unzip -o /tmp/a.zip -d /tmp/so || true
          find /tmp/so -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/libhachimi-meta.so" \;
          ls -l "$GITHUB_WORKSPACE/libhachimi-meta.so"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f libhachimi-meta.so
          git commit -m "build: metadata-hook libhachimi.so (run $RID)" || echo "no change"
          git pull --rebase --autostash || true
          git push || true