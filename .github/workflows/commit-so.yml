name: commit-so

# 取最近一次成功的 hachimi-build 产物，提交进仓库
on:
  push:
    paths:
      - '.github/workflows/commit-so.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: find last successful run
        run: |
          RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hachimi-build.yml/runs?per_page=10" \
                --jq '[.workflow_runs[] | select(.conclusion=="success")][0].id')
          echo "RID=$RID" >> $GITHUB_ENV
          echo "run=$RID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"'
      - name: download
        run: |
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ env.RID }}/artifacts" --jq '.artifacts[0].id')
          echo "artifact=$AID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/a.zip
          ls -l /tmp/a.zip
          unzip -o /tmp/a.zip -d /tmp/so
          find /tmp/so -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/libhachimi-meta.so" \;
          ls -l "$GITHUB_WORKSPACE/libhachimi-meta.so"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f libhachimi-meta.so
          git commit -m "build: metadata-hook libhachimi.so (run ${{ env.RID }})" || echo "no change"
          git pull --rebase --autostash || true
          git push || true