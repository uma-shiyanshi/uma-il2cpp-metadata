name: commit-so

# 在 hachimi-build 完成后，把它的 artifact 取出来提交进仓库（raw 可直接下载）
on:
  workflow_run:
    workflows: ["hachimi-build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  commit:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: download artifact
        run: |
          RID=${{ github.event.workflow_run.id }}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[].name'
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[0].id')
          echo "artifact=$AID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/a.zip
          unzip -o /tmp/a.zip -d /tmp/so
          find /tmp/so -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/libhachimi-meta.so" \;
          ls -l "$GITHUB_WORKSPACE/libhachimi-meta.so"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f libhachimi-meta.so
          git commit -m "build: metadata-hook libhachimi.so (${{ github.event.workflow_run.id }})" || echo "no change"
          git pull --rebase --autostash || true
          git push || true