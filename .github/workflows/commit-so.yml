name: commit-so

# 取出最近一次成功的 hachimi-build artifact 并提交进仓库（raw 可直接下载）
on:
  push:
    paths:
      - '.github/workflows/commit-so.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["hachimi-build"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  commit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: download artifact
        run: |
          if [ -n "${{ github.event.workflow_run.id }}" ]; then
            RID="${{ github.event.workflow_run.id }}"
          else
            RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hachimi-build.yml/runs?per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "run=$RID"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[] | "\(.id) \(.name) \(.size_in_bytes)"'
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" --jq '.artifacts[0].id')
          echo "artifact=$AID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/a.zip
          unzip -o /tmp/a.zip -d /tmp/so || true
          find /tmp/so -name "*.so" -exec cp {} "$GITHUB_WORKSPACE/libhachimi-meta.so" \;
          ls -l "$GITHUB_WORKSPACE/libhachimi-meta.so" || echo "no so found"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f libhachimi-meta.so
          git commit -m "build: metadata-hook libhachimi.so" || echo "no change"
          git pull --rebase --autostash || true
          git push || true