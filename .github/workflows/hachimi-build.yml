name: hachimi-build

# meta-only：无法走 metadata 的 hook 直接跳过，绝不回退 inline（ACE 会比对代码字节）
on:
  push:
    paths:
      - '.github/workflows/hachimi-build.yml'
      - 'tools/meta_patch.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: all
        run: |
          LOG=build-log.txt
          : > "$LOG"
          exec >> "$LOG" 2>&1
          set -x

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

          git clone --depth 1 -b 2020 https://github.com/Hachimi-Hachimi/Hachimi-Unity2020.git hz
          bash tools/meta_patch.sh hz
          sed -i 's/as \*mut Il2CppMethodInfo/as *mut MethodInfo/' hz/src/il2cpp/symbols.rs
          sed -i 's/methodPointer = new_fn as \*mut c_void;/methodPointer = new_fn;/' hz/src/il2cpp/symbols.rs

          python3 - hz <<'PY'
          import pathlib
          p = pathlib.Path("hz/src/il2cpp/hook/mod.rs")
          s = p.read_text(encoding="utf-8")
          old = ('                if !done {\n'
                 '                    let res = hachimi.interceptor.hook($orig as usize, $hook as usize);\n'
                 '                    if let Err(e) = res { error!("{}", e); }\n'
                 '                }\n')
          new = ('                if !done {\n'
                 '                    warn!("skip (no meta): {}", stringify!($hook));\n'
                 '                }\n')
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding="utf-8")
              print("meta-only patched")
          else:
              print("anchor missing")
          PY

          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang++"
          export CXXSTDLIB="c++_static"
          export RUSTFLAGS="-C link-arg=-lc++_static -C link-arg=-lc++abi"

          cd hz
          cargo build --release --target aarch64-linux-android
          SO=target/aarch64-linux-android/release/libhachimi.so
          ls -l "$SO"
          cp "$SO" ../libhachimi-meta.so
          sha256sum ../libhachimi-meta.so

      - name: publish
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f libhachimi-meta.so ]; then
            NAME="libhachimi-metaonly-$(date -u +%m%d-%H%M).so"
            cp libhachimi-meta.so "$NAME"
            gh release view builds -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create builds -R "$GITHUB_REPOSITORY" --title builds --notes builds
            gh release upload builds "$NAME" -R "$GITHUB_REPOSITORY" --clobber
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          { echo "run: $GITHUB_RUN_ID"; tail -n 60 build-log.txt; } > hachimi-build-status.txt
          git add -f build-log.txt hachimi-build-status.txt || true
          git commit -m "ci: build log ($GITHUB_RUN_ID)" || true
          git pull --rebase --autostash || true
          git push || true