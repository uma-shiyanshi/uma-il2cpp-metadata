name: hachimi-build

# 彻底绕开 dlopen：symbols_impl::dlsym 改为自己解析 libil2cpp 的 ELF（maps 基址 + dynsym）
on:
  push:
    paths:
      - '.github/workflows/hachimi-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust + Android target
        run: |
          LOG="$GITHUB_WORKSPACE/h.log"; : > "$LOG"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >> "$LOG" 2>&1
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android >> "$LOG" 2>&1
      - name: 拉源码
        run: |
          LOG="$GITHUB_WORKSPACE/h.log"
          git clone --depth 1 -b 2020 https://github.com/Hachimi-Hachimi/Hachimi-Unity2020.git "$GITHUB_WORKSPACE/hz" >> "$LOG" 2>&1
      - name: 打补丁
        run: |
          LOG="$GITHUB_WORKSPACE/h.log"
          python3 - "$GITHUB_WORKSPACE/hz" >> "$LOG" 2>&1 <<'PY'
          import sys, pathlib
          root = pathlib.Path(sys.argv[1])

          # 1) 配置项 + hook 开关
          cfg = root / "src/core/hachimi.rs"
          t = cfg.read_text(encoding="utf-8")
          if "poll_il2cpp" not in t:
              a = "    pub disable_gui_once: bool,"
              t = t.replace(a, a + ("\n    #[serde(default)]\n    pub late_load: bool,"
                                    "\n    #[serde(default)]\n    pub disable_dlopen_hook: bool,"
                                    "\n    #[serde(default)]\n    pub poll_il2cpp: bool,"), 1)
              cfg.write_text(t, encoding="utf-8"); print("OK Config")

          hk = root / "src/android/hook.rs"
          h = hk.read_text(encoding="utf-8")
          old = ('    info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '    hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;')
          new = ('    if !hachimi.config.load().disable_dlopen_hook {\n'
                 '        info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '        hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;\n'
                 '    } else {\n'
                 '        info!("dlopen hook disabled by config");\n'
                 '    }')
          hk.write_text(h.replace(old, new, 1), encoding="utf-8"); print("OK hook.rs")

          # 2) 自研符号解析
          sym = root / "src/android/symbols_impl.rs"
          sym.write_text(r'''use std::{collections::HashMap, ffi::c_void, sync::OnceLock};

use std::fs;

static CACHE: OnceLock<HashMap<String, usize>> = OnceLock::new();

fn read_u16(b: &[u8], o: usize) -> u16 { u16::from_le_bytes([b[o], b[o+1]]) }
fn read_u32(b: &[u8], o: usize) -> u32 { u32::from_le_bytes([b[o], b[o+1], b[o+2], b[o+3]]) }
fn read_u64(b: &[u8], o: usize) -> u64 { u64::from_le_bytes([b[o],b[o+1],b[o+2],b[o+3],b[o+4],b[o+5],b[o+6],b[o+7]]) }

fn il2cpp_base_and_path() -> Option<(usize, String)> {
    let maps = fs::read_to_string("/proc/self/maps").ok()?;
    let mut base = usize::MAX;
    let mut path = String::new();
    for line in maps.lines() {
        if let Some(i) = line.find('/') {
            let p = line[i..].trim_end_matches(" (deleted)").trim();
            if p.ends_with("libil2cpp.so") {
                if let Some(rng) = line.split_whitespace().next() {
                    if let Some(s) = rng.split('-').next() {
                        if let Ok(a) = usize::from_str_radix(s, 16) {
                            if a < base { base = a; path = p.to_string(); }
                        }
                    }
                }
            }
        }
    }
    if base == usize::MAX || path.is_empty() { None } else { Some((base, path)) }
}

fn build_cache() -> HashMap<String, usize> {
    let mut map = HashMap::new();
    let Some((base, path)) = il2cpp_base_and_path() else { return map };
    let Ok(data) = fs::read(&path) else { return map };
    if data.len() < 64 || &data[0..4] != b"\x7fELF" || data[4] != 2 { return map; }
    let shoff = read_u64(&data, 0x28) as usize;
    let shentsize = read_u16(&data, 0x3a) as usize;
    let shnum = read_u16(&data, 0x3c) as usize;
    if shoff == 0 || shnum == 0 { return map; }
    let mut dynsym = None;
    let mut dynstr = None;
    let mut sections = Vec::new();
    for i in 0..shnum {
        let o = shoff + i * shentsize;
        if o + 64 > data.len() { break; }
        let stype = read_u32(&data, o + 4);
        let off = read_u64(&data, o + 0x18) as usize;
        let size = read_u64(&data, o + 0x20) as usize;
        let link = read_u32(&data, o + 0x28) as usize;
        sections.push((stype, off, size, link));
    }
    for &(stype, off, size, _link) in &sections {
        if stype == 11 { dynsym = Some((off, size)); }
    }
    if let Some((_, _, _, link)) = sections.iter().find(|s| s.0 == 11) {
        if let Some(&(_, soff, ssize, _)) = sections.get(*link) { dynstr = Some((soff, ssize)); }
    }
    let (Some((symoff, symsize)), Some((stroff, strsize))) = (dynsym, dynstr) else { return map };
    let count = symsize / 24;
    for i in 0..count {
        let o = symoff + i * 24;
        if o + 24 > data.len() { break; }
        let name_off = read_u32(&data, o) as usize;
        let value = read_u64(&data, o + 8) as usize;
        if value == 0 || name_off >= strsize { continue; }
        let s = stroff + name_off;
        if s >= data.len() { continue; }
        let mut e = s;
        while e < data.len() && data[e] != 0 { e += 1; }
        if let Ok(name) = std::str::from_utf8(&data[s..e]) {
            if !name.is_empty() { map.insert(name.to_string(), base + value); }
        }
    }
    map
}

pub unsafe fn dlsym(handle: *mut c_void, name: &str) -> usize {
    let cache = CACHE.get_or_init(build_cache);
    if let Some(&addr) = cache.get(name) { return addr; }
    if handle.is_null() || handle as usize == 1 { return 0; }
    let Ok(c) = std::ffi::CString::new(name) else { return 0 };
    libc::dlsym(handle, c.as_ptr()) as usize
}
''', encoding="utf-8")
          print("OK symbols_impl (ELF 解析)")

          # 3) 轮询：直接给假句柄（非 null 且不等于 1 会被当作真句柄）
          mn = root / "src/android/main.rs"
          m = mn.read_text(encoding="utf-8")
          old2 = ('    info!("JNI_OnLoad");\n'
                  '    orig_fn(vm, reserved)\n')
          new2 = ('    info!("JNI_OnLoad");\n'
                  '    if Hachimi::instance().config.load().late_load {\n'
                  '        info!("late_load: skip orig JNI_OnLoad");\n'
                  '        if Hachimi::instance().config.load().poll_il2cpp {\n'
                  '            std::thread::spawn(|| {\n'
                  '                let mut done = false;\n'
                  '                for _ in 0..360 {\n'
                  '                    std::thread::sleep(std::time::Duration::from_millis(500));\n'
                  '                    let hachimi = Hachimi::instance();\n'
                  '                    let maps = std::fs::read_to_string("/proc/self/maps").unwrap_or_default();\n'
                  '                    let hit = maps.lines().any(|l| l.contains("libil2cpp.so"));\n'
                  '                    if hit && !done {\n'
                  '                        info!("poll: il2cpp present, using ELF resolver");\n'
                  '                        hachimi.on_dlopen("libil2cpp.so", 1);\n'
                  '                        done = true;\n'
                  '                        for _ in 0..6 { std::thread::sleep(std::time::Duration::from_millis(500)); }\n'
                  '                        info!("poll: forcing cri stage");\n'
                  '                        if hachimi.on_dlopen("libcri_ware_unity.so", 1) {\n'
                  '                            info!("poll: hooking triggered");\n'
                  '                            break;\n'
                  '                        }\n'
                  '                    }\n'
                  '                }\n'
                  '            });\n'
                  '        }\n'
                  '        return jni::sys::JNI_VERSION_1_6;\n'
                  '    }\n'
                  '    orig_fn(vm, reserved)\n')
          assert old2 in m, "main.rs 锚点未命中"
          mn.write_text(m.replace(old2, new2, 1), encoding="utf-8"); print("OK poll (ELF resolver)")
          PY
      - name: 交叉编译（静态 libc++）
        run: |
          LOG="$GITHUB_WORKSPACE/h.log"
          . "$HOME/.cargo/env"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang++"
          export CXXSTDLIB="c++_static"
          export RUSTFLAGS="-C link-arg=-lc++_static -C link-arg=-lc++abi"
          cd "$GITHUB_WORKSPACE/hz"
          cargo build --release --target aarch64-linux-android >> "$LOG" 2>&1
          echo "cargo exit=$?" >> "$LOG"
          ls -l target/aarch64-linux-android/release/libhachimi.so >> "$LOG" 2>&1
      - name: 发布
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/h.log"
          SO="$GITHUB_WORKSPACE/hz/target/aarch64-linux-android/release/libhachimi.so"
          if [ -f "$SO" ]; then
            echo "sha256: $(sha256sum "$SO" | cut -d' ' -f1)" >> "$LOG"
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$SO" "libhachimi-elf-$(date -u +%m%d-%H%M).so"
            gh release upload builds libhachimi-elf-*.so -R "$GITHUB_REPOSITORY" --clobber >> "$LOG" 2>&1
          fi
          { echo "run: $GITHUB_RUN_ID $(date -u +%FT%TZ)"; tail -n 50 "$LOG"; } > hachimi-build-status.txt
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hachimi-build-status.txt || true
          git commit -m "ci: hachimi ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true