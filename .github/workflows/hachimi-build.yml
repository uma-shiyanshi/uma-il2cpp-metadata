name: hachimi-build

# 预热：JNI_OnLoad 时就把符号表读好（避免和游戏加载抢内核锁导致卡死）
on:
  push:
    paths:
      - '.github/workflows/hachimi-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"; rustup target add aarch64-linux-android
      - name: clone
        run: git clone --depth 1 -b 2020 https://github.com/Hachimi-Hachimi/Hachimi-Unity2020.git "$GITHUB_WORKSPACE/hz"
      - name: write symbols_impl
        run: |
          cat > /tmp/sym.rs <<'RSEOF'
          use std::{collections::HashMap, ffi::c_void, sync::OnceLock};
          use std::os::unix::fs::FileExt;

          static CACHE: OnceLock<HashMap<String, usize>> = OnceLock::new();
          thread_local! { static ATTACHED: std::cell::Cell<bool> = std::cell::Cell::new(false); }

          const DT_HASH: u64 = 4;
          const DT_STRTAB: u64 = 5;
          const DT_SYMTAB: u64 = 6;
          const PT_DYNAMIC: u32 = 2;

          fn u16le(b: &[u8], o: usize) -> u16 { u16::from_le_bytes([b[o], b[o + 1]]) }
          fn u32le(b: &[u8], o: usize) -> u32 { u32::from_le_bytes([b[o], b[o+1], b[o+2], b[o+3]]) }
          fn u64le(b: &[u8], o: usize) -> u64 { u64::from_le_bytes([b[o],b[o+1],b[o+2],b[o+3],b[o+4],b[o+5],b[o+6],b[o+7]]) }

          fn il2cpp_base() -> Option<usize> {
              let maps = std::fs::read_to_string("/proc/self/maps").ok()?;
              let mut base = usize::MAX;
              for line in maps.lines() {
                  if line.contains("libil2cpp.so") {
                      if let Some(rng) = line.split_whitespace().next() {
                          if let Some(s) = rng.split('-').next() {
                              if let Ok(a) = usize::from_str_radix(s, 16) { if a < base { base = a; } }
                          }
                      }
                  }
              }
              if base == usize::MAX { None } else { Some(base) }
          }

          fn build_cache() -> HashMap<String, usize> {
              let mut out = HashMap::new();
              let Some(base) = il2cpp_base() else { return out };
              let Ok(f) = std::fs::File::open("/proc/self/mem") else { return out };
              let adj = |v: u64| -> u64 { if v != 0 && (v as usize) < base { (base + v as usize) as u64 } else { v } };
              let mut hdr = [0u8; 64];
              if f.read_exact_at(&mut hdr, base as u64).is_err() { return out; }
              if &hdr[0..4] != b"\x7fELF" { return out; }
              let phoff = u64le(&hdr, 0x20) as usize;
              let phentsize = u16le(&hdr, 0x36) as usize;
              let phnum = u16le(&hdr, 0x38) as usize;
              let mut dyn_v: usize = 0;
              for i in 0..phnum {
                  let mut ph = [0u8; 56];
                  if f.read_exact_at(&mut ph, (base + phoff + i * phentsize) as u64).is_err() { break; }
                  if u32le(&ph, 0) == PT_DYNAMIC { dyn_v = u64le(&ph, 0x10) as usize; }
              }
              if dyn_v == 0 { return out; }
              let mut symtab: u64 = 0; let mut strtab: u64 = 0; let mut hash: u64 = 0;
              for i in 0..512 {
                  let mut d = [0u8; 16];
                  if f.read_exact_at(&mut d, (base + dyn_v + i * 16) as u64).is_err() { break; }
                  let tag = u64le(&d, 0); let val = u64le(&d, 8);
                  if tag == 0 { break; }
                  match tag { DT_SYMTAB => symtab = val, DT_STRTAB => strtab = val, DT_HASH => hash = val, _ => {} }
              }
              if symtab == 0 || strtab == 0 { return out; }
              let symtab = adj(symtab); let strtab = adj(strtab); let hash = adj(hash);
              let mut count: usize = 0;
              if hash != 0 {
                  let mut hb = [0u8; 8];
                  if f.read_exact_at(&mut hb, hash + 4).is_ok() { count = u32le(&hb, 0) as usize; }
              }
              if count == 0 || count > 500000 {
                  count = if strtab > symtab { ((strtab - symtab) / 24) as usize } else { 20000 };
              }
              let mut n = 0usize;
              for i in 0..count {
                  let mut s = [0u8; 24];
                  if f.read_exact_at(&mut s, symtab + (i as u64) * 24).is_err() { break; }
                  let name_off = u32le(&s, 0) as u64;
                  let value = u64le(&s, 8);
                  if value == 0 { continue; }
                  let mut nb = [0u8; 256];
                  if f.read_exact_at(&mut nb, strtab + name_off).is_err() { continue; }
                  let end = nb.iter().position(|&c| c == 0).unwrap_or(nb.len());
                  if end == 0 { continue; }
                  if let Ok(nm) = std::str::from_utf8(&nb[..end]) {
                      out.insert(nm.to_string(), base + value as usize);
                      n += 1;
                  }
              }
              log::info!("symbols: base={:#x} inserted={}", base, n);
              out
          }

          pub fn warmup() {
              let c = CACHE.get_or_init(build_cache);
              log::info!("symbols: warmup done, {} entries", c.len());
          }

          unsafe fn ensure_attached(cache: &HashMap<String, usize>) {
              if ATTACHED.with(|c| c.get()) { return; }
              let (Some(&dg), Some(&ta)) = (cache.get("il2cpp_domain_get"), cache.get("il2cpp_thread_attach")) else { return };
              if dg == 0 || ta == 0 { return; }
              let domain_get: extern "C" fn() -> *mut c_void = std::mem::transmute(dg);
              let thread_attach: extern "C" fn(*mut c_void) -> *mut c_void = std::mem::transmute(ta);
              let dom = domain_get();
              if !dom.is_null() {
                  let th = thread_attach(dom);
                  log::info!("symbols: attached dom={:#x} th={:#x}", dom as usize, th as usize);
                  ATTACHED.with(|c| c.set(true));
              }
          }

          pub unsafe fn dlsym(handle: *mut c_void, name: &str) -> usize {
              let cache = CACHE.get_or_init(build_cache);
              ensure_attached(cache);
              if let Some(&addr) = cache.get(name) { return addr; }
              if handle.is_null() || handle as usize == 1 { return 0; }
              let Ok(c) = std::ffi::CString::new(name) else { return 0 };
              libc::dlsym(handle, c.as_ptr()) as usize
          }
          RSEOF
          sed -i 's/^          //' /tmp/sym.rs
          cp /tmp/sym.rs "$GITHUB_WORKSPACE/hz/src/android/symbols_impl.rs"
      - name: patch
        run: |
          python3 - "$GITHUB_WORKSPACE/hz" <<'PY'
          import sys, pathlib
          root = pathlib.Path(sys.argv[1])
          cfg = root / "src/core/hachimi.rs"
          t = cfg.read_text(encoding="utf-8")
          if "poll_il2cpp" not in t:
              a = "    pub disable_gui_once: bool,"
              t = t.replace(a, a + ("\n    #[serde(default)]\n    pub late_load: bool,"
                                    "\n    #[serde(default)]\n    pub disable_dlopen_hook: bool,"
                                    "\n    #[serde(default)]\n    pub poll_il2cpp: bool,"), 1)
              cfg.write_text(t, encoding="utf-8")
          hk = root / "src/android/hook.rs"
          h = hk.read_text(encoding="utf-8")
          old = ('    info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '    hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;')
          new = ('    if !hachimi.config.load().disable_dlopen_hook {\n'
                 '        info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '        hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;\n'
                 '    } else { info!("dlopen hook disabled by config"); }')
          hk.write_text(h.replace(old, new, 1), encoding="utf-8")
          mn = root / "src/android/main.rs"
          m = mn.read_text(encoding="utf-8")
          old2 = '    info!("JNI_OnLoad");\n    orig_fn(vm, reserved)\n'
          new2 = ('    info!("JNI_OnLoad");\n'
                  '    if Hachimi::instance().config.load().late_load {\n'
                  '        if Hachimi::instance().config.load().poll_il2cpp {\n'
                  '            std::thread::spawn(|| {\n'
                  '                std::thread::sleep(std::time::Duration::from_millis(1500));\n'
                  '                // 预热：此时游戏刚起，读符号表不易与加载竞争\n'
                  '                crate::symbols_impl::warmup();\n'
                  '                let mut done = false;\n'
                  '                for _ in 0..360 {\n'
                  '                    std::thread::sleep(std::time::Duration::from_millis(500));\n'
                  '                    let h = Hachimi::instance();\n'
                  '                    let maps = std::fs::read_to_string("/proc/self/maps").unwrap_or_default();\n'
                  '                    if !done && maps.lines().any(|l| l.contains("libil2cpp.so")) {\n'
                  '                        h.on_dlopen("libil2cpp.so", 1);\n'
                  '                        done = true;\n'
                  '                        for _ in 0..6 { std::thread::sleep(std::time::Duration::from_millis(500)); }\n'
                  '                        if h.on_dlopen("libcri_ware_unity.so", 1) { break; }\n'
                  '                    }\n'
                  '                }\n'
                  '            });\n'
                  '        }\n'
                  '        return jni::sys::JNI_VERSION_1_6;\n'
                  '    }\n'
                  '    orig_fn(vm, reserved)\n')
          assert old2 in m
          mn.write_text(m.replace(old2, new2, 1), encoding="utf-8")
          print("patched")
          PY
      - name: build
        run: |
          . "$HOME/.cargo/env"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang++"
          export CXXSTDLIB="c++_static"
          export RUSTFLAGS="-C link-arg=-lc++_static -C link-arg=-lc++abi"
          cd "$GITHUB_WORKSPACE/hz"
          cargo build --release --target aarch64-linux-android 2>&1 | tail -8
      - name: publish
        if: always()
        run: |
          SO="$GITHUB_WORKSPACE/hz/target/aarch64-linux-android/release/libhachimi.so"
          if [ -f "$SO" ]; then
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试" || true
            cp "$SO" "libhachimi-warm-$(date -u +%m%d-%H%M).so"
            gh release upload builds libhachimi-warm-*.so -R "$GITHUB_REPOSITORY" --clobber || true
          fi