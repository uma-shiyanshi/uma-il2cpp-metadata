name: hachimi-build

# metadata hook：直接改写 MethodInfo->methodPointer（不动代码字节，绕开 ACE 的 opcode 校验）
on:
  push:
    paths:
      - '.github/workflows/hachimi-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"; rustup target add aarch64-linux-android
      - name: clone
        run: git clone --depth 1 -b 2020 https://github.com/Hachimi-Hachimi/Hachimi-Unity2020.git "$GITHUB_WORKSPACE/hz"
      - name: symbols_impl（同前）
        run: |
          cat > /tmp/sym.rs <<'RSEOF'
          use std::{collections::HashMap, ffi::c_void, sync::OnceLock};
          use std::os::unix::fs::FileExt;

          static CACHE: OnceLock<HashMap<String, usize>> = OnceLock::new();
          static EMPTY: OnceLock<HashMap<String, usize>> = OnceLock::new();
          thread_local! { static ATTACHED: std::cell::Cell<bool> = std::cell::Cell::new(false); }

          const DT_HASH: u64 = 4;
          const DT_STRTAB: u64 = 5;
          const DT_SYMTAB: u64 = 6;
          const PT_DYNAMIC: u32 = 2;

          fn u16le(b: &[u8], o: usize) -> u16 { u16::from_le_bytes([b[o], b[o + 1]]) }
          fn u32le(b: &[u8], o: usize) -> u32 { u32::from_le_bytes([b[o], b[o+1], b[o+2], b[o+3]]) }
          fn u64le(b: &[u8], o: usize) -> u64 { u64::from_le_bytes([b[o],b[o+1],b[o+2],b[o+3],b[o+4],b[o+5],b[o+6],b[o+7]]) }

          fn il2cpp_base() -> Option<usize> {
              let maps = std::fs::read_to_string("/proc/self/maps").ok()?;
              let mut exec_base = usize::MAX;
              let mut any_base = usize::MAX;
              for line in maps.lines() {
                  if !line.contains("libil2cpp.so") { continue; }
                  let mut it = line.split_whitespace();
                  let rng = it.next().unwrap_or("");
                  let perms = it.next().unwrap_or("");
                  let start = rng.split('-').next().unwrap_or("");
                  let Ok(a) = usize::from_str_radix(start, 16) else { continue };
                  if a < any_base { any_base = a; }
                  if perms.contains('x') && a < exec_base { exec_base = a; }
              }
              if exec_base != usize::MAX { Some(exec_base) } else if any_base != usize::MAX { Some(any_base) } else { None }
          }

          fn build_cache() -> HashMap<String, usize> {
              let mut out = HashMap::new();
              let Some(base) = il2cpp_base() else { return out };
              let Ok(f) = std::fs::File::open("/proc/self/mem") else { return out };
              let adj = |v: u64| -> u64 { if v != 0 && (v as usize) < base { (base + v as usize) as u64 } else { v } };
              let mut hdr = [0u8; 64];
              if f.read_exact_at(&mut hdr, base as u64).is_err() { return out; }
              if &hdr[0..4] != b"\x7fELF" { return out; }
              let phoff = u64le(&hdr, 0x20) as usize;
              let phentsize = u16le(&hdr, 0x36) as usize;
              let phnum = u16le(&hdr, 0x38) as usize;
              let mut dyn_v: usize = 0;
              for i in 0..phnum {
                  let mut ph = [0u8; 56];
                  if f.read_exact_at(&mut ph, (base + phoff + i * phentsize) as u64).is_err() { break; }
                  if u32le(&ph, 0) == PT_DYNAMIC { dyn_v = u64le(&ph, 0x10) as usize; }
              }
              if dyn_v == 0 { return out; }
              let mut symtab: u64 = 0; let mut strtab: u64 = 0; let mut hash: u64 = 0;
              for i in 0..512 {
                  let mut d = [0u8; 16];
                  if f.read_exact_at(&mut d, (base + dyn_v + i * 16) as u64).is_err() { break; }
                  let tag = u64le(&d, 0); let val = u64le(&d, 8);
                  if tag == 0 { break; }
                  match tag { DT_SYMTAB => symtab = val, DT_STRTAB => strtab = val, DT_HASH => hash = val, _ => {} }
              }
              if symtab == 0 || strtab == 0 { return out; }
              let symtab = adj(symtab); let strtab = adj(strtab); let hash = adj(hash);
              let mut count: usize = 0;
              if hash != 0 {
                  let mut hb = [0u8; 8];
                  if f.read_exact_at(&mut hb, hash + 4).is_ok() { count = u32le(&hb, 0) as usize; }
              }
              if count == 0 || count > 500000 {
                  count = if strtab > symtab { ((strtab - symtab) / 24) as usize } else { 20000 };
              }
              let mut n = 0usize;
              for i in 0..count {
                  let mut s = [0u8; 24];
                  if f.read_exact_at(&mut s, symtab + (i as u64) * 24).is_err() { break; }
                  let name_off = u32le(&s, 0) as u64;
                  let value = u64le(&s, 8);
                  if value == 0 { continue; }
                  let mut nb = [0u8; 256];
                  if f.read_exact_at(&mut nb, strtab + name_off).is_err() { continue; }
                  let end = nb.iter().position(|&c| c == 0).unwrap_or(nb.len());
                  if end == 0 { continue; }
                  if let Ok(nm) = std::str::from_utf8(&nb[..end]) {
                      out.insert(nm.to_string(), base + value as usize);
                      n += 1;
                  }
              }
              if n > 0 { log::info!("symbols: exec_base={:#x} inserted={}", base, n); }
              out
          }

          fn cache() -> &'static HashMap<String, usize> {
              if let Some(c) = CACHE.get() { return c; }
              let m = build_cache();
              if !m.is_empty() { let _ = CACHE.set(m); }
              CACHE.get().unwrap_or_else(|| EMPTY.get_or_init(HashMap::new))
          }

          pub fn warmup() {
              for i in 0..120 {
                  let m = build_cache();
                  if !m.is_empty() {
                      let n = m.len();
                      let _ = CACHE.set(m);
                      log::info!("symbols: warmup done {} entries (try {})", n, i);
                      return;
                  }
                  std::thread::sleep(std::time::Duration::from_millis(500));
              }
              log::warn!("symbols: warmup gave up");
          }

          unsafe fn ensure_attached(c: &HashMap<String, usize>) {
              if ATTACHED.with(|x| x.get()) { return; }
              let (Some(&dg), Some(&ta)) = (c.get("il2cpp_domain_get"), c.get("il2cpp_thread_attach")) else { return };
              if dg == 0 || ta == 0 { return; }
              let domain_get: extern "C" fn() -> *mut c_void = std::mem::transmute(dg);
              let thread_attach: extern "C" fn(*mut c_void) -> *mut c_void = std::mem::transmute(ta);
              let dom = domain_get();
              if !dom.is_null() {
                  let th = thread_attach(dom);
                  log::info!("symbols: attached dom={:#x} th={:#x}", dom as usize, th as usize);
                  ATTACHED.with(|x| x.set(true));
              }
          }

          pub unsafe fn dlsym(handle: *mut c_void, name: &str) -> usize {
              let c = cache();
              ensure_attached(c);
              if let Some(&addr) = c.get(name) { return addr; }
              let Ok(cs) = std::ffi::CString::new(name) else { return 0 };
              let p = libc::dlsym(std::ptr::null_mut(), cs.as_ptr()) as usize;
              if p != 0 { return p; }
              if handle.is_null() || handle as usize == 1 { return 0; }
              libc::dlsym(handle, cs.as_ptr()) as usize
          }
          RSEOF
          sed -i 's/^          //' /tmp/sym.rs
          cp /tmp/sym.rs "$GITHUB_WORKSPACE/hz/src/android/symbols_impl.rs"
      - name: patch（metadata hook 三处改动）
        run: |
          python3 - "$GITHUB_WORKSPACE/hz" <<'PY'
          import sys, pathlib
          root = pathlib.Path(sys.argv[1])

          # 1) symbols.rs：记录 methodPointer -> MethodInfo*，并提供改写函数
          sy = root / "src/il2cpp/symbols.rs"
          s = sy.read_text(encoding="utf-8")
          if "META_MAP" not in s:
              s = s.replace(
                  "use crate::core::Hachimi;",
                  "use crate::core::Hachimi;\nuse std::collections::HashMap;\nuse std::sync::Mutex;\n\n"
                  "pub static META_MAP: once_cell::sync::Lazy<Mutex<HashMap<usize, usize>>> = "
                  "once_cell::sync::Lazy::new(|| Mutex::new(HashMap::new()));\n", 1)
              old_addr = ("    if let Ok(method) = res {\n"
                          "        unsafe { (*method).methodPointer }\n"
                          "    }")
              new_addr = ("    if let Ok(method) = res {\n"
                          "        unsafe {\n"
                          "            let p = (*method).methodPointer as usize;\n"
                          "            if p != 0 { META_MAP.lock().unwrap().insert(p, method as usize); }\n"
                          "            p\n"
                          "        }\n"
                          "    }")
              s = s.replace(old_addr, new_addr)
              sy.write_text(s, encoding="utf-8")
              print("symbols.rs 记录映射")

              ap = ("\n\npub fn method_info_of(addr: usize) -> Option<usize> {\n"
                    "    META_MAP.lock().unwrap().get(&addr).copied()\n"
                    "}\n\n"
                    "pub unsafe fn patch_method_pointer(method_info: usize, new_fn: usize) -> Option<usize> {\n"
                    "    let mi = method_info as *mut Il2CppMethodInfo;\n"
                    "    if mi.is_null() { return None; }\n"
                    "    let old = (*mi).methodPointer as usize;\n"
                    "    (*mi).methodPointer = new_fn as *mut c_void;\n"
                    "    Some(old)\n"
                    "}\n")
              with open(sy, "a", encoding="utf-8") as f:
                  f.write(ap)

          # 2) hook/mod.rs：new_hook! 优先走 metadata（指针替换）
          hm = root / "src/il2cpp/hook/mod.rs"
          h = hm.read_text(encoding="utf-8")
          old_macro = ("            if ($orig != 0) {\n"
                       "                let res = hachimi.interceptor.hook($orig as usize, $hook as usize);\n"
                       "                if let Err(e) = res {\n"
                       "                    error!(\"{}\", e);\n"
                       "                }\n"
                       "            }")
          new_macro = ("            if ($orig != 0) {\n"
                       "                let mut done = false;\n"
                       "                if let Some(mi) = crate::il2cpp::symbols::method_info_of($orig as usize) {\n"
                       "                    if let Some(old) = unsafe { crate::il2cpp::symbols::patch_method_pointer(mi, $hook as usize) } {\n"
                       "                        crate::core::interceptor::register_meta_orig($hook as usize, old);\n"
                       "                        info!(\"meta_hook!: {} (mi={:#x})\", stringify!($hook), mi);\n"
                       "                        done = true;\n"
                       "                    }\n"
                       "                }\n"
                       "                if !done {\n"
                       "                    let res = hachimi.interceptor.hook($orig as usize, $hook as usize);\n"
                       "                    if let Err(e) = res {\n"
                       "                        error!(\"{}\", e);\n"
                       "                    }\n"
                       "                }\n"
                       "            }")
          assert old_macro in h, "hook/mod.rs 锚点未命中"
          hm.write_text(h.replace(old_macro, new_macro, 1), encoding="utf-8")
          print("hook/mod.rs metadata 分支")

          # 3) interceptor.rs：get_orig_fn! 优先取 metadata 原地址
          ic = root / "src/core/interceptor.rs"
          c = ic.read_text(encoding="utf-8")
          if "register_meta_orig" not in c:
              c = c.replace(
                  "macro_rules! get_orig_fn {",
                  "static META_ORIG: once_cell::sync::Lazy<std::sync::Mutex<std::collections::HashMap<usize, usize>>> =\n"
                  "    once_cell::sync::Lazy::new(|| std::sync::Mutex::new(std::collections::HashMap::new()));\n\n"
                  "pub fn register_meta_orig(hook: usize, orig: usize) {\n"
                  "    META_ORIG.lock().unwrap().insert(hook, orig);\n"
                  "}\n\n"
                  "pub fn get_orig_addr(hook: usize) -> usize {\n"
                  "    if let Some(&a) = META_ORIG.lock().unwrap().get(&hook) { return a; }\n"
                  "    crate::core::Hachimi::instance().interceptor.get_trampoline_addr(hook)\n"
                  "}\n\n"
                  "macro_rules! get_orig_fn {", 1)
              old_g = ("        unsafe { std::mem::transmute::<usize, $type>(crate::core::Hachimi::instance().interceptor.get_trampoline_addr($hook as usize)) }")
              new_g = ("        unsafe { std::mem::transmute::<usize, $type>(crate::core::interceptor::get_orig_addr($hook as usize)) }")
              assert old_g in c, "get_orig_fn 锚点未命中"
              c = c.replace(old_g, new_g, 1)
              ic.write_text(c, encoding="utf-8")
              print("interceptor.rs get_orig_fn")

          # 4) 配置项 + JNI_OnLoad + late load（同前）
          cfg = root / "src/core/hachimi.rs"
          t = cfg.read_text(encoding="utf-8")
          if "poll_il2cpp" not in t:
              a = "    pub disable_gui_once: bool,"
              t = t.replace(a, a + ("\n    #[serde(default)]\n    pub late_load: bool,"
                                    "\n    #[serde(default)]\n    pub disable_dlopen_hook: bool,"
                                    "\n    #[serde(default)]\n    pub poll_il2cpp: bool,"), 1)
              cfg.write_text(t, encoding="utf-8")
          hk = root / "src/android/hook.rs"
          hkf = hk.read_text(encoding="utf-8")
          old = ('    info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '    hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;')
          new = ('    if !hachimi.config.load().disable_dlopen_hook {\n'
                 '        info!("Hooking {} at {:#x}", dlopen_name, dlopen_orig);\n'
                 '        hachimi.interceptor.hook(dlopen_orig, dlopen_hook)?;\n'
                 '    } else { info!("dlopen hook disabled by config"); }')
          hk.write_text(hkf.replace(old, new, 1), encoding="utf-8")

          mn = root / "src/android/main.rs"
          m = mn.read_text(encoding="utf-8")
          old2 = '    info!("JNI_OnLoad");\n    orig_fn(vm, reserved)\n'
          new2 = ('    info!("JNI_OnLoad");\n'
                  '    if Hachimi::instance().config.load().late_load {\n'
                  '        if Hachimi::instance().config.load().poll_il2cpp {\n'
                  '            std::thread::spawn(|| {\n'
                  '                crate::symbols_impl::warmup();\n'
                  '                let mut done = false;\n'
                  '                for _ in 0..360 {\n'
                  '                    std::thread::sleep(std::time::Duration::from_millis(500));\n'
                  '                    let h = Hachimi::instance();\n'
                  '                    let maps = std::fs::read_to_string("/proc/self/maps").unwrap_or_default();\n'
                  '                    if !done && maps.lines().any(|l| l.contains("libil2cpp.so")) {\n'
                  '                        h.on_dlopen("libil2cpp.so", 1);\n'
                  '                        done = true;\n'
                  '                        for _ in 0..6 { std::thread::sleep(std::time::Duration::from_millis(500)); }\n'
                  '                        if h.on_dlopen("libcri_ware_unity.so", 1) { break; }\n'
                  '                    }\n'
                  '                }\n'
                  '            });\n'
                  '        }\n'
                  '        return jni::sys::JNI_VERSION_1_6;\n'
                  '    }\n'
                  '    orig_fn(vm, reserved)\n')
          assert old2 in m
          mn.write_text(m.replace(old2, new2, 1), encoding="utf-8")
          print("main.rs / hook.rs ok")
          PY
      - name: build
        run: |
          . "$HOME/.cargo/env"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang++"
          export CXXSTDLIB="c++_static"
          export RUSTFLAGS="-C link-arg=-lc++_static -C link-arg=-lc++abi"
          cd "$GITHUB_WORKSPACE/hz"
          cargo build --release --target aarch64-linux-android 2>&1 | tail -20
      - name: publish
        if: always()
        run: |
          SO="$GITHUB_WORKSPACE/hz/target/aarch64-linux-android/release/libhachimi.so"
          if [ -f "$SO" ]; then
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试" || true
            cp "$SO" "libhachimi-meta-$(date -u +%m%d-%H%M).so"
            gh release upload builds libhachimi-meta-*.so -R "$GITHUB_REPOSITORY" --clobber || true
          fi