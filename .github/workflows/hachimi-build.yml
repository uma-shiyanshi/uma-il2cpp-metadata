name: hachimi-build

# 精简版：取 tools/meta_patch.sh 应用补丁 → 交叉编译 → 上传 release（带详细输出）
on:
  push:
    paths:
      - '.github/workflows/hachimi-build.yml'
      - 'tools/meta_patch.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"; rustup target add aarch64-linux-android

      - name: clone hachimi
        run: git clone --depth 1 -b 2020 https://github.com/Hachimi-Hachimi/Hachimi-Unity2020.git hz

      - name: apply patch
        run: bash tools/meta_patch.sh hz

      - name: build
        run: |
          . "$HOME/.cargo/env"
          NDK=$(ls -d "$ANDROID_HOME"/ndk/* | tail -1)
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang++"
          export CXXSTDLIB="c++_static"
          export RUSTFLAGS="-C link-arg=-lc++_static -C link-arg=-lc++abi"
          cd hz
          cargo build --release --target aarch64-linux-android 2>&1 | tail -15
          ls -l target/aarch64-linux-android/release/libhachimi.so

      - name: publish
        if: always()
        run: |
          SO="$GITHUB_WORKSPACE/hz/target/aarch64-linux-android/release/libhachimi.so"
          [ -f "$SO" ] || { echo "no so"; exit 0; }
          NAME="libhachimi-meta-$(date -u +%m%d-%H%M).so"
          cp "$SO" "$NAME"
          echo "== release list =="
          gh release view builds -R "$GITHUB_REPOSITORY" --json tagName -q .tagName || gh release create builds -R "$GITHUB_REPOSITORY" --title builds --notes builds
          echo "== upload $NAME =="
          gh release upload builds "$NAME" -R "$GITHUB_REPOSITORY" --clobber
          echo "== after upload =="
          gh release view builds -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | tail -5